security:
  url-rules:
    #    add Account
    - pattern: /user/add-account
      method: POST
      any-of-permissions:
        - Add Account

    - pattern: /user/add-account/*
      method: POST
      any-of-permissions:
        - Add Account For SubUser

    - pattern: /admin/user/add-account/*
      method: POST
      any-of-permissions:
        - Add Account For Any User

    - pattern: /admin/user/add-account/*/*
      method: POST
      any-of-permissions:
        - Add Account For Any Users SubUser



    #      modify account
    - pattern: /user/modify-account-details/*/*
      method: PUT
      any-of-permissions:
        - Modify Account Details

    - pattern: /user/modify-account-details/*/*/*
      method: PUT
      any-of-permissions:
        - Modify Account Details For SubUser

    - pattern: /admin/user/modify-account-details/*/*/*
      method: PUT
      any-of-permissions:
        - Modify Account Details For Any User

    - pattern: /admin/subowner/modify-account-details/*/*/*/*
      method: PUT
      any-of-permissions:
        - Modify Account Details For Any Users SubUser


    #Delete account

    - pattern: /user/delete-account/*/*
      method: DELETE
      any-of-permissions:
        - Delete Account

    - pattern: /user/delete-account/*/*/*
      method: DELETE
      any-of-permissions:
        - Delete Subuser Account

    - pattern: /admin/user/delete-account/*/*/*
      method: DELETE
      any-of-permissions:
        - Delete Any User Account

    - pattern: /admin/subuser/delete-account/*/*/*/*
      method: DELETE
      any-of-permissions:
        - Delete Any Users Subuser Account

    #get account details

    - pattern: /user/get-account-details/*/*
      method: GET
      any-of-permissions:
        - Get Own Account Details

    - pattern: /user/get-account-details/*/*/*
      method: GET
      any-of-permissions:
        - Get Subuser Account Details

    - pattern: /admin/user/get-account-details/*/*/*
      method: GET
      any-of-permissions:
        - Get Any User Account Details

    - pattern: /admin/subuser/get-account-details/*/*/*/*
      method: GET
      any-of-permissions:
        - Get Any Users Subuser Account Details


    #get all account details

    - pattern: /user/get-all-account-details
      method: GET
      any-of-permissions:
        - Get Own All Account Details

    - pattern: /user/get-all-account-details/*
      method: GET
      any-of-permissions:
        - Get Subuser All Account Details

    - pattern: /admin/user/get-all-account-details/*
      method: GET
      any-of-permissions:
        - Get Any User All Account Details

    - pattern: /admin/subuser/get-all-account-details/*/*
      method: GET
      any-of-permissions:
        - Get Any Users Subuser All Account Details



    #get methods all account details
    - pattern: /user/get-any-method-all-account-details/*
      method: GET
      any-of-permissions:
        - Get Own All Account Method Wise Details

    - pattern: /user/get-any-method-all-account-details/*/*
      method: GET
      any-of-permissions:
        - Get Subuser All Account Method Wise Details

    - pattern: /admin/user/get-any-method-all-account-details/*/*
      method: GET
      any-of-permissions:
        - Get Any User All Account Method Wise Details

    - pattern: /admin/subuser/get-all-any-method-account-details/*/*/*
      method: GET
      any-of-permissions:
        - Get Any Users Subuser All Account Method Wise Details



    #get all soft-deleted account details
    - pattern: /user/get-soft-deleted-account-list
      method: GET
      any-of-permissions:
        - Get Soft Deleted Account List

    - pattern: /user/get-soft-deleted-account-list/*
      method: GET
      any-of-permissions:
        - Get Soft Deleted Account List of SubUsers

    - pattern: /admin/user/get-soft-deleted-account-list/*
      method: GET
      any-of-permissions:
        - Get Soft Deleted Account List of Any User

    - pattern: /admin/subuser/get-soft-deleted-account-list/*/*
      method: GET
      any-of-permissions:
        - Get Soft Deleted Account List of Any Users SubUser



    #restoring accounts from softDeleted
    - pattern: /user/restore-account/*/*
      method: PUT
      any-of-permissions:
        - Restore Own SoftDeleted Account

    - pattern: /user/restore-account/*/*/*
      method: PUT
      any-of-permissions:
        - Restore SubUsers SoftDeleted Account

    - pattern: /admin/user/restore-account/*/*/*
      method: PUT
      any-of-permissions:
        - Restore SoftDeleted Account of Any Users

    - pattern: /admin/subuser/restore-account/*/*/*/*
      method: PUT
      any-of-permissions:
        - Restore SoftDeleted Account of Any Users SubUser


    # permanently delete account from softDelete
    - pattern: /user/delete-account-permanently/*/*
      method: DEL
      any-of-permissions:
        - Delete Own SoftDeleted Account

    - pattern: /user/delete-account-permanently/*/*/*
      method: DEL
      any-of-permissions:
        - Delete SubUsers SoftDeleted Account

    - pattern: /admin/user/delete-account-permanently/*/*/*
      method: DEL
      any-of-permissions:
        - Delete SoftDeleted Account of Any Users

    - pattern: /admin/subuser/delete-account-permanently/*/*/*/*
      method: DEL
      any-of-permissions:
        - Delete SoftDeleted Account of Any Users SubUser


    # getting account balance
    - pattern: /user/get-account-balance/*/*
      method: GET
      any-of-permissions:
        - Get Account Balance

    - pattern: /user/get-account-balance/*/*/*
      method: GET
      any-of-permissions:
        - Get Account Balance of SubUser

    - pattern: /admin/user/get-account-balance/*/*/*
      method: GET
      any-of-permissions:
        - Get Account Balance of Any User

    - pattern: /admin/subuser/get-account-balance/*/*/*/*
      method: GET
      any-of-permissions:
        - Get Account Balance of Any Users SubUsers


    # getting account balance currency Wise
    - pattern: /user/get-account-balance/*
      method: GET
      any-of-permissions:
        - Get Total Balance Currency Wise

    - pattern: /user/get-total-balance/*/*
      method: GET
      any-of-permissions:
        - Get Total Balance Currency Wise of SubUser

    - pattern: /admin/user/get-total-balance/*/*
      method: GET
      any-of-permissions:
        - Get Total Balance Currency Wise of Any User

    - pattern: /admin/subuser/get-total-balance/*/*/*
      method: GET
      any-of-permissions:
        - Get Total Balance Currency Wise of Any Users SubUsers



    # updating account balance
    - pattern: /user/update-account-balance/*/*
      method: PUT
      any-of-permissions:
        - Update Account Balance

    - pattern: /user/update-account-balance/*/*/*
      method: PUT
      any-of-permissions:
        - Update Account Balance of SubUser

    - pattern: /admin/user/update-account-balance/*/*/*
      method: PUT
      any-of-permissions:
        - Update Account Balance of Any User

    - pattern: /admin/subuser/update-account-balance/*/*/*/*
      method: PUT
      any-of-permissions:
        - Update Account Balance of Any Users SubUsers


    # transfering balance to any account
    - pattern: /user/transfer-balance
      method: POST
      any-of-permissions:
        - Transfer Balance to Any Account

    - pattern: /user/transfer-balance/*
      method: POST
      any-of-permissions:
        - Transfer Balance to Any Account of SubUser

    - pattern: /admin/user/transfer-balance/*
      method: POST
      any-of-permissions:
        - Transfer Balance to Any Account of Any User

    - pattern: /admin/subuser/transfer-balance/*/*
      method: POST
      any-of-permissions:
        - Transfer Balance to Any Account of Any Users SubUsers



    # search accounts
    - pattern: /user/search-accounts
      method: GET
      any-of-permissions:
        - Search Account

    - pattern: /admin/search-accounts
      method: GET
      any-of-permissions:
        - Search Account of All Users

    - pattern: /admin/search-accounts/*
      method: GET
      any-of-permissions:
        - Search Account of All Users By UserId
